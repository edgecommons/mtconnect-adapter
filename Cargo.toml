[package]
name = "mtconnect-adapter"
version = "1.0.0"
edition = "2021"
# Matches the edgecommons library's MSRV (edition-2024 crate).
rust-version = "1.85"
license = "BUSL-1.1"
description = "The MtconnectAdapter component."
publish = false

[[bin]]
name = "mtconnect-adapter"
path = "src/main.rs"

# Runtime selection mirrors the edgecommons library:
#   - `standalone` (default): dual-broker MQTT — runs on a laptop/container, no C
#     toolchain. Use this for `cargo run` / `cargo test` during development.
#   - `greengrass`: Greengrass IPC — the on-device build. Linux-only (the SDK is a
#     C-FFI crate needing libclang). `build.sh` builds the artifact with this feature.
[features]
default = ["standalone"]
standalone = ["edgecommons/standalone"]
greengrass = ["edgecommons/greengrass"]
# Direct CloudWatch metric target (AWS SDK PutMetricData); combine with `greengrass`.
cloudwatch = ["edgecommons/cloudwatch"]

[dependencies]
# edgecommons Rust library. The dependency form is chosen by `--dep-source` at generation:
#   local    -> path = "<abs path to libs/rust>"   (a monorepo checkout; the dev default)
#   registry -> git = "https://github.com/edgecommons/edgecommons", tag = "rust-lib/vX.Y.Z"
#
# `local` IS this template's local-dev override: a Cargo path dependency resolves straight from
# the sibling checkout's current source, so a freshly generated component needs no extra override
# step. `registry` pins the published tag. Move between them later with
# `edgecommons component upgrade --to <version>`.
edgecommons = { git = "https://github.com/edgecommons/edgecommons", rev = "a14a3285573ef2bb6a531e1e1936c6dc40a85ef4", default-features = false, features = ["credentials"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
quick-xml = "0.41.0"
sha2 = "0.11.0"
url = "2.5.8"
smallvec = "1.15.2"
arc-swap = "1.9.2"
base64 = "0.23.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2"] }

[dev-dependencies]
jsonschema = { version = "0.49.2", default-features = false }
tempfile = "3"
#  enables tokio's paused clock for the virtual-clock sequence tests
# (tests/stream_sequence.rs, LLD 12 row 3).
tokio = { version = "1", features = ["test-util"] }
# A local TLS agent for the transport-security leg (tests/tls_auth.rs): a throwaway private CA and
# server/client identities, minted in-process so the suite needs no fixture files and no network.
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
