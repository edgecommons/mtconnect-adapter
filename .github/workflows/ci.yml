name: ci

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

jobs:
  ci:
    # Reusable component CI from the org defaults repo. `secrets: inherit` passes the org-level
    # EDGECOMMONS_READ_TOKEN so cargo can fetch the private edgecommons git dependency (only needed
    # for a `registry`/`pinned-rev` --dep-source; harmless if unused). The repo must be added to
    # that secret's repository allow-list (org Actions secrets, via the REST API).
    permissions:
      contents: read
    uses: edgecommons/.github/.github/workflows/component-ci.yml@main
    with:
      language: RUST
    secrets: inherit

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Org rule: 90% line coverage in all four languages; live-infra-only paths are validated
      # through lab/HOST smoke instead of being forced into unit coverage. Do NOT lower this gate
      # or exclude testable code to pass it — add tests.
      #
      # The `ethernet-ip-adapter` discipline (its ci.yml): the untestable live code is kept in
      # dedicated, as-thin-as-possible seam files so a file-level exclusion removes ONLY code that
      # needs a live runtime and never launders out tested logic. Every pure decision the component
      # makes — the connect/poll/publish/reconnect orchestration, reconnect backoff, the write
      # allow-list, pause gating, per-device connectivity, the bounded-shutdown math, and the
      # metric-family recording/drain/§5-assembly math — lives in `driver.rs` / `app.rs` /
      # `commands.rs` / `device.rs` / `metrics.rs`, stays IN the denominator, and IS unit-tested.
      # Excluded, each pinned to a reason:
      #   - `src/supervisor.rs` — construction, spawning and the shutdown INVOCATION (`App::new`/
      #     `run`, plus `FacadeWire`): it builds the `edgecommons` runtime's per-instance
      #     `data()`/`events()` facades (which the library exposes no other way), resolves vault
      #     credentials, starts the agent runtimes, and registers the command surface. The
      #     orchestration it used to hold — `run_device`, `run_polling`, `poll_once`,
      #     `serve_while_down`, the publish paths — now lives in `src/driver.rs`, IN the denominator,
      #     driven end to end by a fake `DeviceBackend`/`DeviceSession` over a recording `Wire`.
      #   - `src/main.rs` — the binary bootstrap shim (build the runtime, hand off to `supervisor::App`).
      #   - `tests/live_sim.rs` — the self-skipping (`EC_LIVE_SIM`) live suite: it exercises a real
      #     simulator/device, so its body is uncovered in a normal `cargo test` run.
      #   - `tests/agent_integration.rs` — the self-skipping (`EC_MTC_AGENT`) live suite against the
      #     pinned cppagent Docker harness (tests/compose.mtconnect-agent.yaml): its body needs a
      #     real agent plus the docker CLI, so it is uncovered in a normal `cargo test` run.
      # Both live suites self-skip only when their endpoint is unset; a leg that sets
      # `EC_REQUIRE_LIVE` turns the skip into a hard failure, so a run that was supposed to have the
      # infrastructure can never pass vacuously. They are validated against real endpoints (the
      # validation-matrix HOST/lab legs) and by the scaffold→build gate.
      # NOTHING ELSE is excluded.
      - run: >
          cargo llvm-cov --fail-under-lines 90
          --ignore-filename-regex '(supervisor\.rs|main\.rs|tests[/\\](live_.*|agent_integration)\.rs)'
